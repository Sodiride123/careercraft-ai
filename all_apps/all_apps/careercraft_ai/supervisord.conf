[supervisord]
nodaemon=true
logfile=/workspace/linkedin-resume-app/logs/supervisord.log
pidfile=/workspace/linkedin-resume-app/logs/supervisord.pid
loglevel=info

[program:careercraft-app]
command=python /workspace/linkedin-resume-app/app.py
directory=/workspace/linkedin-resume-app
autostart=true
autorestart=true
stderr_logfile=/workspace/linkedin-resume-app/logs/app_error.log
stdout_logfile=/workspace/linkedin-resume-app/logs/app_output.log
environment=HOME="/root",PATH="/usr/local/bin:%(ENV_PATH)s"
user=root